<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topic Progress — Sabilearn</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/app-shell.css">
<link rel="stylesheet" href="../../assets/css/pages/courses.css">
<link rel="stylesheet" href="../../assets/css/pages/progress.css">
<script>window.SITE_ROOT = '../../'; window.APP_ROOT = '../';</script>
</head>
<body data-page="progress">
<div class="app-shell">

  <div data-include="sidebar"></div>

  <div class="app-main">
    <header class="topbar">
      <button class="mobile-sidebar-toggle" aria-label="Open menu">☰</button>
      <div data-include="topbar"></div>
    </header>

    <div class="page-content" style="max-width:720px; margin:0 auto;">

      <a href="progress.html" class="back-link">← Back to Progress</a>

      <div class="topic-details-header">
        <div>
          <span class="badge" id="topic-badge"></span>
          <h1 id="topic-title"></h1>
        </div>
        <div class="topic-mastery-ring-wrap">
          <svg width="64" height="64" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="26" fill="none" stroke="var(--color-border)" stroke-width="6"/>
            <circle id="topic-mastery-ring-fill" cx="32" cy="32" r="26" fill="none" stroke="var(--color-primary)" stroke-width="6"
              stroke-dasharray="163.36" stroke-linecap="round" transform="rotate(-90 32 32)"/>
          </svg>
          <div class="value" id="topic-mastery-value"></div>
        </div>
      </div>

      <div class="topic-metric-grid">
        <div class="overview-stat"><div class="value" id="metric-quiz"></div><div class="label">Quiz accuracy</div></div>
        <div class="overview-stat"><div class="value" id="metric-practice"></div><div class="label">Practice accuracy</div></div>
        <div class="overview-stat"><div class="value" id="metric-flashcard"></div><div class="label">Flashcard recall</div></div>
        <div class="overview-stat"><div class="value" id="metric-activity"></div><div class="label">Recent activity</div></div>
      </div>

      <div class="topic-strengths-grid">
        <div class="card">
          <h4 style="font-size:15px; margin-bottom:10px;">You did well in</h4>
          <ul id="strengths-list"></ul>
        </div>
        <div class="card">
          <h4 style="font-size:15px; margin-bottom:10px;">Needs attention</h4>
          <ul id="needs-attention-list"></ul>
        </div>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <h4 style="font-size:15px; margin-bottom:10px;">AI Insight</h4>
        <p style="font-size:14px; color:var(--color-text-muted);" id="topic-ai-insight"></p>
      </div>

      <div class="topic-actions-row">
        <a href="#" id="action-study" class="btn btn-primary">Study This Topic</a>
        <a href="#" id="action-practice" class="btn btn-secondary">Practice</a>
        <a href="#" id="action-flashcards" class="btn btn-secondary">Review Flashcards</a>
        <a href="#" id="action-quiz" class="btn btn-secondary">Take a Quiz</a>
      </div>

    </div>
  </div>
</div>

<script src="../../assets/js/include.js"></script>
<script src="../../assets/js/dialogs.js"></script>
<script src="../../assets/js/pages/topic-details.js"></script>
</body>
</html>
