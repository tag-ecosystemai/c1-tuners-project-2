<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password — Sabilearn</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/app-shell.css">
<link rel="stylesheet" href="../../assets/css/pages/auth.css">
<link rel="stylesheet" href="../../assets/css/pages/account.css">
<script>window.SITE_ROOT = '../../'; window.APP_ROOT = '../';</script>
</head>
<body data-page="settings">
<div class="app-shell">

  <div data-include="sidebar"></div>

  <div class="app-main">
    <header class="topbar">
      <button class="mobile-sidebar-toggle" aria-label="Open menu">☰</button>
      <div data-include="topbar"></div>
    </header>

    <div class="page-content">
      <div class="settings-page" style="max-width:420px;">

        <div id="change-password-view">
          <a href="profile-settings.html" class="back-link">← Back</a>
          <div class="card">
            <h1 style="font-size:22px;">Change Password</h1>
            <p class="sub">Choose a new password for your account.</p>
            <form id="change-password-form" novalidate>
              <div class="field">
                <label for="current-password">Current Password</label>
                <input type="password" id="current-password">
                <p class="field-error">Enter your current password.</p>
              </div>
              <div class="field">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password">
                <p class="field-error">Password must be at least 8 characters.</p>
                <p id="password-strength" style="font-size:12.5px; margin-top:6px;"></p>
              </div>
              <div class="field">
                <label for="confirm-new-password">Confirm New Password</label>
                <input type="password" id="confirm-new-password">
                <p class="field-error">Passwords don&rsquo;t match.</p>
              </div>
              <button type="submit" class="btn btn-primary auth-submit">Update Password</button>
            </form>
          </div>
        </div>

        <div id="password-success-view" class="card" style="display:none; text-align:center;">
          <div class="course-ready-icon">✓</div>
          <h1 style="font-size:22px; margin-bottom:6px;">Password updated</h1>
          <p class="sub">Your password has been changed successfully.</p>
          <a href="profile-settings.html" class="btn btn-primary" style="width:100%; justify-content:center;">Back to Settings</a>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="../../assets/js/include.js"></script>
<script src="../../assets/js/dialogs.js"></script>
<script src="../../assets/js/pages/change-password.js"></script>
</body>
</html>
