<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizzes — Sabilearn</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">

<script>window.SITE_ROOT = '../../'; window.APP_ROOT = '../';</script>

<body data-page="quizzes">
<div class="app-shell">

  <div data-include="sidebar"></div>

  <div class="app-main">
    <header class="topbar">
      <button class="mobile-sidebar-toggle" aria-label="Open menu">☰</button>
      <div data-include="topbar"></div>

    <div class="page-content">
      <div class="quizzes-header">
        <div>

          <p>Every quiz across your learning space — practice whenever you're ready.</p>

        <a href="quiz-setup.html" class="btn btn-primary">+ Generate Quiz</a>

      <div class="home-section-title"><h3>Continue</h3></div>

      <div id="recent-quizzes" style="margin-bottom:28px;"></div>

      <div class="home-section-title">
        <h3>Quiz History</h3>
        <a href="#" id="toggle-history-link">View all →</a>
      </div>
      <div id="quiz-history" style="display:none; margin-bottom:28px;"></div>

      <div class="home-section-title"><h3>Browse by Course</h3></div>
      <div class="course-chip-row" id="course-chip-row"></div>
