<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material — Sabilearn</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/app-shell.css">
<link rel="stylesheet" href="../../assets/css/pages/courses.css">
<link rel="stylesheet" href="../../assets/css/pages/material-viewer.css">
<script>window.SITE_ROOT = '../../'; window.APP_ROOT = '../';</script>
</head>
<body data-page="library">
<div class="app-shell">

  <div data-include="sidebar"></div>

  <div class="app-main">
    <header class="topbar">
      <button class="mobile-sidebar-toggle" aria-label="Open menu">☰</button>
      <div data-include="topbar"></div>
    </header>

    <div class="page-content">

      <a href="library.html" class="back-link" id="back-link">← Back</a>

      <div class="viewer-header">
        <div class="viewer-header-left">
          <h1 id="viewer-title"></h1>
          <div class="meta" id="viewer-meta"></div>
        </div>
        <div class="header-menu-wrap">
          <button class="header-menu-btn" id="viewer-menu-btn">⋯</button>
          <div class="header-menu-dropdown" id="viewer-menu-dropdown">
            <button id="viewer-menu-rename">Rename</button>
            <button>Move to another course</button>
            <button class="is-danger" id="viewer-menu-delete">Delete</button>
          </div>
        </div>
      </div>

      <div class="viewer-toolbar">
        <div class="viewer-search">
          <span>🔍</span>
          <input type="text" id="viewer-search-input" placeholder="Search this material...">
        </div>
        <span id="viewer-search-results" style="font-size:12.5px; color:var(--color-text-faint);"></span>
        <div class="viewer-actionbar">
          <button class="btn btn-secondary btn-sm" id="action-summarize">Summarize</button>
          <button class="btn btn-secondary btn-sm" id="action-quiz">Generate Quiz</button>
          <button class="btn btn-secondary btn-sm" id="action-flashcards">Generate Flashcards</button>
          <button class="viewer-panel-toggle" id="viewer-panel-toggle" title="Toggle AI panel">✦</button>
        </div>
      </div>

      <div class="viewer-layout" id="viewer-layout">
        <div>
          <div class="viewer-document">
            <div id="viewer-doc-body"></div>
          </div>
          <div class="viewer-pagination">
            <button id="viewer-prev">← Previous</button>
            <span class="viewer-page-label" id="viewer-page-label"></span>
            <button id="viewer-next">Next →</button>
          </div>
        </div>

        <div class="viewer-ai-panel">
          <div id="viewer-ai-root"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../../assets/js/include.js"></script>
<script src="../../assets/js/dialogs.js"></script>
<script src="../../assets/js/api-config.js"></script>
<script src="../../assets/js/ai-tutor-engine.js"></script>
<script src="../../assets/js/pages/material-viewer.js"></script>
</body>
</html>
